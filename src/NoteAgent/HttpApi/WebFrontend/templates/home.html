// ========== 主逻辑 ==========
async function ask() {
  // 同步门闩：必须在任何 await 之前置位，否则双击的第二次调用会在第一次的 await
  // （refreshIfStale）期间看到 isStreaming 仍为 false，从而多发一轮请求、多写一条消息。
  if (isStreaming) return;

  const question = textarea.value.trim();
  if (!question) return;

  isStreaming = true;
  ModelSettings.setStreaming(true);
  applyModelBusyState();

  // 另一个标签页可能刚开了向量维护窗口：发送前刷新一次服务端状态。
  try {
    await ModelSettings.refreshIfStale();
  } catch (err) {
    // 刷新失败不影响发送本身：后端仍会按维护状态拒绝。
  }
  if (!ModelSettings.canSend()) {
    // 输入框这时还没被清空，用户的问题原样留在原处。
    appendMessage("assistant", "向量索引重建中，暂时不能发送消息；已有内容仍可查看。");
    isStreaming = false;
    ModelSettings.setStreaming(false);
    applyModelBusyState();
    return;
  }

  textarea.value = "";
  textarea.style.height = "auto";

  // 隐藏欢迎页
  const welcomeEl = document.getElementById("welcome");
  if (welcomeEl) welcomeEl.remove();

  // 渲染用户消息
  appendMessage("user", question);

  // 渲染空的助手消息
  const assistEl = appendMessage("assistant", "", [], [], { live: true });
  const bodyEl = assistEl.querySelector(".msg-body");
  const steps = [];

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, conversation_id: currentConversationId })
    });
    if (!res.ok) {
      const json = await res.json().catch(() => ({}));
      // 服务端拒绝（例如维护窗口返回 409）时把这次输入还给用户；
      // 只在输入框仍为空时恢复，避免覆盖用户随后打的新字。
      if (!textarea.value.trim()) {
        textarea.value = question;
        autoResize(textarea);
      }
      throw new Error(res.status === 404 ? "会话不存在" : errorMessage(json, res));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let rawText = "";
    let eventName = "token";
    let citations = [];
    // 本轮 SSE 归属的会话：用户中途切走时，草稿要进它自己的快照而不是当前面板。
    let streamConversationId = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (line.startsWith("event: ")) {
          eventName = line.slice(7).trim();
          continue;
        }
        if (line.startsWith("data: ")) {
          const raw = line.slice(6);
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            payload = raw;
          }
          if (eventName === "conversation") {
            if (payload && typeof payload === "object") {
              adoptCitePaneConversation(payload.id);
              currentConversationId = payload.id;
              streamConversationId = payload.id;
              loadConversations(payload.id);
            }
          } else if (eventName === "thinking") {
            completeOpenPhase(steps, "_think");
            completeOpenPhase(steps, "_gen");
            steps.push({ name: "_think", status: "", preview: "", arguments: "", content: "" });
            paintTrace(assistEl, steps, true);
          } else if (eventName === "generating") {
            ensureGenerating(steps);
            paintTrace(assistEl, steps, true);
          } else if (eventName === "think") {
            const add = typeof payload === "string" ? payload : "";
            if (add) {
              let think = [...steps].reverse().find((s) => s.name === "_think");
              if (!think) {
                think = { name: "_think", status: "", preview: "", arguments: "", content: "" };
                steps.push(think);
              }
              think.content = (think.content || "") + add;
              if (think.content.length > 4000) think.content = think.content.slice(0, 4000) + "…";
            }
            paintTrace(assistEl, steps, true);
          } else if (eventName === "tool") {
            completeOpenPhase(steps, "_think");
            completeOpenPhase(steps, "_gen");
            const name = payload && payload.name ? payload.name : "";
            const args = payload && payload.args ? payload.args : {};
            const existing = steps.find((s) => s.name === name && !s.status);
            if (existing) {
              existing.arguments = JSON.stringify(args);
            } else {
              steps.push({ name, status: "", preview: "", arguments: JSON.stringify(args), content: "" });
            }
            paintTrace(assistEl, steps, true);
          } else if (eventName === "tool_done") {
            const step = steps.find((s) => s.name === payload.name && !s.status) || steps[steps.length - 1];
            if (step && payload && typeof payload === "object") {
              step.status = payload.status || "ok";
              step.preview = payload.preview || "";
              step.arguments = payload.arguments || step.arguments || "";
            }
            paintTrace(assistEl, steps, true);
          } else if (eventName === "draft") {
            // 只有草稿属于当前正在看的会话时才动可见面板，否则进它自己的快照。
            if (!streamConversationId || streamConversationId === currentConversationId) {
              openDraftPane(payload);
            } else {
              stashDraftForConversation(streamConversationId, payload);
            }
          } else if (eventName === "sources") {
            citations = Array.isArray(payload) ? payload : [];
            assistEl.dataset.citations = JSON.stringify(
              localizeCitations(rawText, citations).citations
            );
            bodyEl.innerHTML = renderAssistantHtml(rawText, citations);
          } else if (eventName === "answer" && typeof payload === "string") {
            rawText = payload;
            assistEl.dataset.citations = JSON.stringify(
              localizeCitations(rawText, citations).citations
            );
            bodyEl.innerHTML = renderAssistantHtml(rawText, citations);
          } else if (eventName === "token" && typeof payload === "string") {
            rawText += payload;
            ensureGenerating(steps);
            paintTrace(assistEl, steps, true);
            bodyEl.innerHTML = renderAssistantHtml(rawText, citations);
          }
          continue;
        }
        if (line.trim() === "") {
          eventName = "token";
        }
      }
    }

    bodyEl.innerHTML = renderAssistantHtml(rawText, citations);
    assistEl.dataset.citations = JSON.stringify(
      localizeCitations(rawText, citations).citations
    );
    finishTrace(assistEl, steps);

  } catch (err) {
    bodyEl.textContent = "请求失败：" + err.message;
    finishTrace(assistEl, steps);
  } finally {
    // 异常和取消路径也要在这里释放门闩，否则界面再也发不出下一条消息。
    isStreaming = false;
    ModelSettings.setStreaming(false);
    applyModelBusyState();
    textarea.focus();
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
}

function toolFileName(args) {
  if (!args) return "";
  if (typeof args === "object") return String(args.file_name || args.query || "");
  try {
    const parsed = JSON.parse(args);
    return String(parsed.file_name || parsed.query || "");
  } catch {
    return "";
  }
}

function toolQuery(args) {
  if (!args) return "";
  if (typeof args === "object") return String(args.query || args.file_name || "");
  try {
    const parsed = JSON.parse(args);
    return String(parsed.query || parsed.file_name || "");
  } catch {
    return "";
  }
}

function completeOpenPhase(steps, name) {
  const open = (steps || []).find((s) => s.name === name && !s.status);
  if (open) open.status = "ok";
}

/** True if the turn used a note tool (not _think / _gen). */
function hasRealTools(steps) {
  return (steps || []).some((s) => s.name && s.name[0] !== "_");
}

/** Close thought hops and keep one in-progress generating step for the answer. */
function ensureGenerating(steps) {
  completeOpenPhase(steps, "_think");
  const openGen = (steps || []).find((s) => s.name === "_gen" && !s.status);
  if (!openGen) {
    steps.push({ name: "_gen", status: "", preview: "", arguments: "", content: "" });
  }
}

function toolLiveLabel(step) {
  const name = typeof step === "string" ? step : (step && step.name) || "";
  const args = typeof step === "string" ? "" : (step && step.arguments) || "";
  if (name === "_think") return "Thinking...";
  if (name === "_gen") return "Generating...";
  if (name === "read_file") {
    const file = toolFileName(args);
    return file ? `Reading ${file}...` : "Reading notes...";
  }
  if (name === "list_files") return "Listing notes...";
  if (name === "search_relative_from_chromadb") return "Searching notes...";
  if (name === "propose_note") return "Proposing a note...";
  return name ? `Calling ${name}...` : "Thinking...";
}

function toolFlowLabel(step) {
  if (!step) return "";
  const name = step.name || "";
  if (step.status === "error") return `Failed ${name || "tool"}`;
  if (name === "_think") return "Thought";
  if (name === "_gen") return "Generated";
  if (name === "read_file") {
    const file = toolFileName(step.arguments);
    return file ? `Read ${file}` : "Read notes";
  }
  if (name === "list_files") return "Listed notes";
  if (name === "search_relative_from_chromadb") {
    const q = toolQuery(step.arguments);
    return q ? `Searched ${q}` : "Searched notes";
  }
  if (name === "propose_note") {
    const file = toolFileName(step.arguments);
    return file ? `Proposed ${file}` : "Proposed a note";
  }
  return name ? `Called ${name}` : "";
}

function liveTraceLabel(steps) {
  const running = [...(steps || [])].reverse().find((s) => !s.status);
  if (running) return toolLiveLabel(running);
  if (hasRealTools(steps)) return englishSummary(steps, true);
  if ((steps || []).some((s) => s.name === "_gen")) return "Generating...";
  return "Thinking...";
}

function englishSummary(steps, live) {
  const tools = (steps || []).filter((s) => s.name && s.name[0] !== "_");
  const nRead = tools.filter((s) => s.name === "read_file").length;
  const nSearch = tools.filter((s) => s.name === "search_relative_from_chromadb").length;
  const nList = tools.filter((s) => s.name === "list_files").length;
  const nProp = tools.filter((s) => s.name === "propose_note").length;
  const nErr = tools.filter((s) => s.status === "error").length;
  const bits = [];
  if (nRead) bits.push(nRead === 1 ? "1 file" : `${nRead} files`);
  if (nSearch) bits.push(nSearch === 1 ? "1 search" : `${nSearch} searches`);
  if (nList) bits.push(live ? "Listing notes..." : "Listed notes");
  if (nProp) bits.push(
    nProp === 1
      ? (live ? "Proposing a note..." : "1 proposal")
      : (live ? `${nProp} proposals...` : `${nProp} proposals`)
  );
  if (nErr) bits.push(`${nErr} failed`);
  if (!bits.length) return live ? "Thinking..." : "Thought";
  if (nRead || nSearch) return (live ? "Exploring " : "Explored ") + bits.join(", ");
  return bits.join(", ");
}

function renderTraceList(row, steps) {
  const list = row.querySelector(".msg-trace-list");
  if (!list) return;
  const openThinks = row._openThinks || new Set();
  row._openThinks = openThinks;
  list.innerHTML = (steps || []).map((step, i) => {
    if (step.name === "_gen") return "";
    if (step.name === "_think") {
      const hasBody = !!(step.content && step.content.trim());
      if (step.status && !hasBody) return "";
      const open = openThinks.has(i);
      const label = step.status ? "Thought" : "Thinking...";
      const chev = hasBody ? `<span class="msg-trace-chevron">▼</span>` : "";
      const body = hasBody
        ? `<div class="step-think-body">${escapeHtml(step.content)}</div>`
        : "";
      return `<li class="step-think${open ? " open" : ""}${step.status ? "" : " live"}">
        <button type="button" class="step-think-head" data-i="${i}">
          <span>${escapeHtml(label)}</span>${chev}
        </button>${body}
      </li>`;
    }
    const running = !step.status;
    const label = running ? toolLiveLabel(step) : toolFlowLabel(step);
    return `<li class="${running ? "live" : ""}">${escapeHtml(label)}</li>`;
  }).join("");
  list.querySelectorAll(".step-think-head").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = Number(btn.dataset.i);
      if (openThinks.has(i)) openThinks.delete(i);
      else openThinks.add(i);
      const item = btn.closest(".step-think");
      if (item) item.classList.toggle("open");
    });
  });
}

function paintTrace(row, steps, live) {
  const trace = row.querySelector(".msg-trace");
  const head = row.querySelector(".msg-trace-head");
  const text = row.querySelector(".msg-trace-label");
  if (!trace || !head || !text) return;
  if (!live && !hasRealTools(steps)) {
    trace.hidden = true;
    head.classList.remove("live");
    return;
  }
  trace.hidden = false;
  head.classList.toggle("live", !!live);
  text.textContent = live ? liveTraceLabel(steps) : englishSummary(steps, false);
  renderTraceList(row, steps);
}

function finishTrace(row, steps) {
  (steps || []).forEach((step) => {
    if (!step.status) step.status = "ok";
  });
  const trace = row.querySelector(".msg-trace");
  paintTrace(row, steps, false);
  if (trace) trace.classList.remove("open");
}

function appendMessage(role, text, citations, toolSteps, opts) {
  const row = document.createElement("div");
  row.className = `msg-row ${role}`;

  let avatar = role === "user" ? "👤" : "🤖";
  const body = role === "assistant"
    ? renderAssistantHtml(text, citations)
    : escapeHtml(text);
  if (role === "assistant") {
    row.dataset.citations = JSON.stringify(localizeCitations(text, citations || []).citations);
  }

  const live = opts && opts.live;
  const steps = toolSteps || [];
  const showTrace = role === "assistant" && (live || steps.length);
  const headLabel = live ? liveTraceLabel(steps) : englishSummary(steps, false);

  row.innerHTML = role === "assistant"
    ? `<div class="msg-avatar">${avatar}</div>
    <div class="msg-col">
      <div class="msg-trace"${showTrace ? "" : " hidden"}>
        <button type="button" class="msg-trace-head${live ? " live" : ""}">
          <span class="msg-trace-label">${escapeHtml(headLabel)}</span>
          <span class="msg-trace-chevron">▼</span>
        </button>
        <ul class="msg-trace-list"></ul>
      </div>
      <div class="msg-bubble">
        <div class="msg-body">${body}</div>
      </div>
    </div>`
    : `<div class="msg-avatar">${avatar}</div>
    <div class="msg-bubble">
      <div class="msg-body">${body}</div>
    </div>`;

  if (role === "assistant") {
    const head = row.querySelector(".msg-trace-head");
    if (head) {
      head.addEventListener("click", () => {
        const trace = row.querySelector(".msg-trace");
        if (trace && !trace.hidden) trace.classList.toggle("open");
      });
    }
    if (steps.length) renderTraceList(row, steps);
  }

  chatInner.appendChild(row);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return row;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ========== 页面加载：载入历史 ==========
document.addEventListener("DOMContentLoaded", async () => {
  // 先注册回调再初始化：初始化会立刻拉一次状态并触发一次 busy 回调。
  ModelSettings.onBusyChange(applyModelBusyState);
  ModelSettings.init();
  applyModelBusyState();
  showView(isDocumentsPath() ? "documents" : "chat", false);
  const list = await loadConversations();
  if (list.length && !isDocumentsPath()) openConversation(list[0].id);
});

</script>
</body>
</html>
